<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>People Table</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <main id="login" class="login">
    <section class="card">
      <h1>Welcome Back</h1>
      <p>Sign in with your Google account to view the data.</p>
      <button id="sign-in" class="google-btn" type="button">
        <span class="g-badge" aria-hidden="true">
          <svg viewBox="0 0 48 48" width="18" height="18">
            <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.6 5.9c4.4-4.1 7-10.1 7-17.6z"/>
            <path fill="#FBBC05" d="M10.5 28.7a14.5 14.5 0 0 1 0-9.4l-7.9-6.1a24 24 0 0 0 0 21.6l7.9-6.1z"/>
            <path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.6-5.9c-2.1 1.4-4.8 2.3-8.3 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/>
          </svg>
        </span>
        <span class="label">Sign in with Google</span>
      </button>
      <p id="login-message" class="message" role="alert"></p>
    </section>
  </main>

  <div id="app" hidden>
    <div id="container"></div>
    <div id="menu">
      <button data-layout="table" type="button">TABLE</button>
      <button data-layout="sphere" type="button">SPHERE</button>
      <button data-layout="helix" type="button">HELIX</button>
      <button data-layout="grid" type="button">GRID</button>
    </div>
    <div id="legend" aria-label="Net worth colour key"></div>
    <div id="account">
      <span id="user"></span>
      <button id="sign-out" type="button">Sign out</button>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
